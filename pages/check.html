<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Obsidian Cup | Gate check</title>
  <link rel="icon" href="../assets/favicon.ico?v=2" sizes="any" />
  <link rel="icon" href="../assets/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/glass.css" />
  <link rel="stylesheet" href="../css/account.css" />
</head>
<body class="theme-glass">
  <main id="main" class="acct-wrap">
    <p class="acct-label" data-t="checkLabel">Organiser</p>
    <h1 class="acct-title" data-t="checkTitle">Gate check</h1>
    <div id="checkMsg"><p class="acct-muted" data-t="loading">Loading…</p></div>

    <div class="acct-card acct-gate" id="gateCard" hidden>
      <div class="acct-gate-head">
        <div class="acct-gate-photo"><span id="gInitials" aria-hidden="true"></span><img id="gImg" alt="" hidden /></div>
        <div class="acct-gate-who">
          <p class="acct-gate-name" id="gName"></p>
          <p class="acct-gate-legal" id="gLegal" hidden></p>
          <p class="acct-pc-code" id="gCode"></p>
          <p class="acct-muted" id="gAge"></p>
        </div>
      </div>
      <ul class="acct-gate-status" id="gStatus"></ul>
      <div id="gTeams"></div>
      <p class="acct-hint" data-t="checkCompare">Compare the photo and name with the player's ID before letting them in.</p>
    </div>
  </main>

  <script src="../js/vendor/supabase-js-2.118.0.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/lang.js"></script>
  <script src="../js/lang-site.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/oc-accounts.js"></script>
  <script src="../js/page-check.js"></script>
</body>
</html>
