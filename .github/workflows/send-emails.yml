# Sends queued emails (welcome email with player code, code changes, and
# later payment reminders and confirmations) through the Obsidian Cup Gmail.
# Also keeps the free Supabase project from pausing.
# Secrets live in GitHub: Settings > Secrets and variables > Actions.
# This repository is public: the script never prints addresses or names.
name: Send emails

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-emails
  cancel-in-progress: false

jobs:
  send:
    # Never in a copy (fork) of the repository.
    if: github.repository == 'ObsidianCup/obsidian-cup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to an exact version so a changed tag cannot reach the secrets.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install (pinned versions from the lockfile)
        run: npm ci --prefix scripts/email --ignore-scripts --no-audit --no-fund
      - name: Send
        run: node scripts/email/send-emails.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_MODE: ${{ vars.EMAIL_MODE }}
          EMAIL_TEST_TO: ${{ secrets.EMAIL_TEST_TO }}
